<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#192e59" />
    <title>Reconnect · XVIA</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f8fc;
        color: #192e59;
        font:
          16px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      main {
        width: min(100%, 460px);
        padding: 36px;
        background: white;
        border: 1px solid #e3e9f2;
        border-radius: 24px;
        text-align: center;
      }
      img {
        width: 76px;
        height: 76px;
        margin: 0 auto 20px;
      }
      .label {
        color: #0b4ca1;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        font-size: 28px;
        line-height: 1.2;
        margin: 16px 0;
      }
      p {
        color: #52627a;
      }
      a {
        display: block;
        margin-top: 24px;
        padding: 12px 20px;
        background: #0b4ca1;
        color: white;
        font-weight: 600;
        border-radius: 12px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #078370;
        outline-offset: 4px;
      }
      small {
        display: block;
        margin-top: 24px;
        color: #52627a;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/xvia-icon.png" alt="SZABIST University" width="76" height="76" />
      <div class="label">XVIA · Node Compass Task</div>
      <h1>Let’s get you reconnected.</h1>
      <p>
        XVIA cannot reach the network right now. Check your connection, then try opening your page
        again.
      </p>
      <a href="">Try again</a>
      <small
        >Class content currently needs an internet connection. Saved timetables and offline
        resources will be available in a future update.</small
      >
    </main>
  </body>
</html>
